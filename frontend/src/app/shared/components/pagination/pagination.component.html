<p>
  {{
    'Showing :from–:to of :total :items'
      | translate: {
          from: meta().from ?? 0,
          to: meta().to ?? 0,
          total: meta().total,
          items: (itemLabel() | translate),
        }
  }}
</p>
<div class="pages">
  <button
    class="btn secondary small"
    type="button"
    [disabled]="meta().current_page === 1"
    (click)="changePage(meta().current_page - 1)"
  >
    {{ 'Previous' | translate }}
  </button>
  <span>
    {{
      'Page :current of :last'
        | translate: { current: meta().current_page, last: meta().last_page }
    }}
  </span>
  <button
    class="btn secondary small"
    type="button"
    [disabled]="meta().current_page === meta().last_page"
    (click)="changePage(meta().current_page + 1)"
  >
    {{ 'Next' | translate }}
  </button>
</div>
