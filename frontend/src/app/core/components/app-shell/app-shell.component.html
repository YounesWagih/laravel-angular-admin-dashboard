<div class="shell" [class.menu-open]="menuOpen()">
  <button
    class="menu-overlay"
    type="button"
    aria-label="Close navigation"
    (click)="closeMenu()"
  ></button>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">PM</span>
      <div>
        <strong>Product Management</strong>
        <small>{{ auth.user()?.role?.name ?? '' }}</small>
      </div>
    </div>

    <nav class="navigation" aria-label="Main navigation">
      @for (item of navigationItems; track item.route) {
        @if (item.visible()) {
          <a [routerLink]="item.route" routerLinkActive="active" (click)="closeMenu()">
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <div class="current-user">
        <strong>{{ auth.user()?.name }}</strong>
        <small>{{ auth.user()?.email }}</small>
      </div>

      @if (logoutError(); as error) {
        <p class="logout-error" role="alert">{{ error }}</p>
      }

      <button class="logout-button" type="button" [disabled]="loggingOut()" (click)="logout()">
        {{ loggingOut() ? 'Logging out…' : 'Logout' }}
      </button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button
        class="menu-button"
        type="button"
        aria-label="Open navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <strong class="topbar-title">Product Management</strong>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
