<div class="layout" [class.open]="menuOpen()">
  <button
    class="shade"
    type="button"
    aria-label="Close navigation"
    (click)="closeMenu()"
  ></button>

  <aside class="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true">PM</span>
      <div>
        <strong>Product Management</strong>
        <small>{{ auth.user()?.role?.name ?? '' }}</small>
      </div>
    </div>

    <nav class="nav" aria-label="Main navigation">
      @for (item of navigationItems; track item.route) {
        @if (item.visible()) {
          <a [routerLink]="item.route" routerLinkActive="active" (click)="closeMenu()">
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="sidebar-bottom">
      <div class="user">
        <strong>{{ auth.user()?.name }}</strong>
        <small>{{ auth.user()?.email }}</small>
      </div>

      @if (logoutError(); as error) {
        <p class="logout-error" role="alert">{{ error }}</p>
      }

      <button class="logout" type="button" [disabled]="loggingOut()" (click)="logout()">
        {{ loggingOut() ? 'Logging out…' : 'Logout' }}
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button
        class="menu-btn"
        type="button"
        aria-label="Open navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <span
        class="user-avatar"
        role="img"
        [attr.aria-label]="'User: ' + (auth.user()?.name ?? 'Unknown')"
        [attr.title]="auth.user()?.name ?? 'Unknown user'"
      >
        {{ userInitial() }}
      </span>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
