<app-auth-layout title="Welcome back" subtitle="Sign in to continue to your workspace.">
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (requestError(); as error) {
      <div class="alert error" role="alert">{{ error | translate }}</div>
    }

    <div class="field">
      <label for="email">{{ 'Email address' | translate }}</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      <app-form-field-error [control]="form.controls.email" />
    </div>

    <div class="field">
      <label for="password">{{ 'Password' | translate }}</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      <app-form-field-error [control]="form.controls.password" />
    </div>

    <label class="remember">
      <input type="checkbox" formControlName="remember" />
      <span>{{ 'Remember me' | translate }}</span>
    </label>

    <button class="btn primary full" type="submit" [disabled]="submitting()">
      {{ 'Login' | translate }}
    </button>

    <p class="switch">
      {{ "Don't have an account?" | translate }}
      <a routerLink="/register">{{ 'Register' | translate }}</a>
    </p>
  </form>
</app-auth-layout>
