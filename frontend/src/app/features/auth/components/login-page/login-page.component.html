<app-auth-layout title="Welcome back" subtitle="Sign in to continue to your workspace.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (requestError(); as error) {
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    }

    <div class="form-field">
      <label for="email">Email address</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      <app-form-field-error [control]="form.controls.email" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      <app-form-field-error [control]="form.controls.password" />
    </div>

    <label class="remember-row">
      <input type="checkbox" formControlName="remember" />
      <span>Remember me</span>
    </label>

    <button class="button button-primary button-block" type="submit" [disabled]="submitting()">
      Login
    </button>

    <p class="auth-switch">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>
  </form>
</app-auth-layout>
