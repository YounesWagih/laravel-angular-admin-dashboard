<app-auth-layout
  title="Create your account"
  subtitle="Register to start with the default Viewer role."
>
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (requestError(); as error) {
      <div class="alert error" role="alert">{{ error | translate }}</div>
    }

    <div class="field">
      <label for="name">{{ 'Full name' | translate }}</label>
      <input id="name" type="text" formControlName="name" autocomplete="name" />
      <app-form-field-error [control]="form.controls.name" />
    </div>

    <div class="field">
      <label for="email">{{ 'Email address' | translate }}</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      <app-form-field-error [control]="form.controls.email" />
    </div>

    <div class="field">
      <label for="password">{{ 'Password' | translate }}</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      <app-form-field-error [control]="form.controls.password" />
    </div>

    <div class="field">
      <label for="password-confirmation">{{ 'Confirm password' | translate }}</label>
      <input
        id="password-confirmation"
        type="password"
        formControlName="password_confirmation"
        autocomplete="new-password"
      />
      <app-form-field-error [control]="form.controls.password_confirmation" />
      @if (form.hasError('passwordMismatch') && form.controls.password_confirmation.touched) {
        <p class="match-error" role="alert">
          {{ 'Passwords do not match.' | translate }}
        </p>
      }
    </div>

    <button class="btn primary full" type="submit" [disabled]="submitting()">
      {{ 'Register' | translate }}
    </button>

    <p class="switch">
      {{ 'Already have an account?' | translate }}
      <a routerLink="/login">{{ 'Login' | translate }}</a>
    </p>
  </form>
</app-auth-layout>
